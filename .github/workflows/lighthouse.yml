name: Lighthouse

on:
  pull_request:
  push:
    branches:
      - main
      - audit/**

permissions:
  contents: read

concurrency:
  group: lighthouse-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build production application
        env:
          NEXT_PUBLIC_SITE_URL: https://portfolio.example.com
          BETTER_AUTH_URL: https://portfolio.example.com
          BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef
        run: pnpm --filter @akb-studio/web exec next build --webpack

      - name: Check JavaScript budget
        run: pnpm --filter @akb-studio/web performance:budget

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./apps/web/lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
