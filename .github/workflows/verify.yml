name: Verify

on:
  push:
    branches:
      - main
      - audit/**
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.20.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome
        run: pnpm exec biome check .

      - name: Production dependency audit
        run: pnpm audit --prod --audit-level high

      - name: TypeScript
        run: pnpm typecheck

      - name: Prisma schema
        run: pnpm db:validate
        env:
          DATABASE_URL: postgresql://verify:verify@127.0.0.1:5432/verify

      - name: Unit and contract tests
        run: pnpm test

      - name: Link, secret, and release gates
        run: pnpm quality:links && pnpm quality:secrets && pnpm quality:release

      - name: Security regression tests
        run: pnpm --filter @akb-studio/web security:test

      - name: SEO and theme regression tests
        run: |
          pnpm --filter @akb-studio/web seo:test
          pnpm --filter @akb-studio/web theme:test
          pnpm --filter @akb-studio/web quality:test

      - name: Production build
        env:
          NEXT_PUBLIC_SITE_URL: https://portfolio.example.com
          BETTER_AUTH_URL: https://portfolio.example.com
          BETTER_AUTH_SECRET: 0123456789abcdef0123456789abcdef
        run: pnpm --filter @akb-studio/web exec next build --webpack

      - name: Performance budget
        run: pnpm --filter @akb-studio/web performance:budget
